<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake VS</title>
  <meta name="description" content="Snake VS: a cobrinha clássica com obstáculos, poderes e duelos contra a CPU. Para Android.">
  <link rel="icon" href="icon-512.png">
  <style>
    :root { --bg: #0D1021; --text: #F2F4FF; --dim: #8C93B8; --green: #6CF08A; --pink: #FF6B8A; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; text-align: center; }
    img.feature { width: 100%; height: auto; border-radius: 16px; }
    h1 { font-size: 2rem; margin: 24px 0 8px; }
    h1 .vs { color: var(--pink); }
    p { color: var(--dim); }
    a { color: var(--green); }
    ul { list-style: none; padding: 0; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
<main>
  <img class="feature" src="feature-graphic-1024x500.png" alt="Snake VS: duas cobras disputando maçãs num tabuleiro com obstáculos">
  <h1>Snake <span class="vs">VS</span></h1>
  <p>A cobrinha clássica com obstáculos, poderes e duelos contra a CPU. Offline, sem anúncios e sem coleta de dados.</p>
  <ul>
    <li><a href="privacy/">Política de Privacidade / Privacy Policy</a></li>
    <li><a href="https://github.com/betinn/snakevs">Código-fonte</a></li>
  </ul>
</main>
</body>
</html>

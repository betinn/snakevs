[package]
name = "snakevs-api"
version = "1.0.0"
edition = "2024"
description = "Snake VS online ranking: tiny HTTP API over SQLite"
publish = false

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

# Small, fast binary: whole-program optimization, no debug info.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

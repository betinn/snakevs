# Snake VS on nginx: the game as static files + the ranking API (snakevs-api) on the same site.
# Copy to /etc/nginx/sites-available/, adjust server_name/root, enable, then: nginx -t && systemctl reload nginx
# HTTPS: add your certificate (e.g. certbot --nginx -d jogo.exemplo.com).

server {
    listen 80;
    server_name jogo.exemplo.com;
    root /var/www/snakevs;                    # contents of artifacts/web/wwwroot

    # The publish ships .gz copies of every file: nginx sends them as-is, no CPU spent compressing.
    gzip_static on;

    location / {
        add_header Cache-Control "no-cache";  # revalidated (304) so a new deploy shows up at once
        add_header X-Content-Type-Options "nosniff";
    }

    # Fingerprinted .NET files (name.0123456789.wasm): never change, cache for a year.
    location ~* "\.[0-9a-z]{10}\.(js|wasm|dat)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header X-Forwarded-For $remote_addr;   # real client address for the rate limit
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 4k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
